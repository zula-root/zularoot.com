      const salt = bytes.slice(8, 16), data = bytes.slice(16);
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
      const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: 600000 }, base, 384));
      const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
      const page = await crypto.subtle.decrypt({ name: "AES-CBC", iv: bits.slice(32, 48) }, key, data);
      try { sessionStorage.setItem("kinelo-pw", password); } catch (e) {}
      document.open(); document.write(new TextDecoder().decode(page)); document.close();
    }
    const form = document.getElementById("unlock"), error = document.getElementById("error");
    form.addEventListener("submit", async (e) => {
      e.preventDefault(); error.textContent = "Opening…";
      try { await open(document.getElementById("pw").value); }
      catch (err) { error.textContent = "That password didn’t work."; }
    });
    let saved = null; try { saved = sessionStorage.getItem("kinelo-pw"); } catch (e) {}
    if (saved) open(saved).catch(() => {});
  })();
  </script>
</body>
</html>
